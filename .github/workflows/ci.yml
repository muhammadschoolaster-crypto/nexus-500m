name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Scan for secrets
        run: bash scripts/secret_scan.sh

  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install project deps
        run: pip install -r requirements.txt
      - name: Verify 500M parameter count
        run: python -m nexus.count_params
      - name: Run full test suite
        run: pytest tests/ -q --tb=short

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # runs only once the android app exists on this branch/commit
    if: ${{ hashFiles('android/settings.gradle.kts') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build debug APK (no artifact upload: personal APKs stay out of public CI artifacts)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug
      - name: Run JVM unit tests (tokenizer, inference golden parity, stores)
        run: |
          cd android
          ./gradlew --no-daemon :app:testDebugUnitTest
